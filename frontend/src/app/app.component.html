<main class="loans">
  <section class="loans--container">
    <h1>Loan Management</h1>
    
    <div *ngIf="isLoading" class="loading">
      Loading loans...
    </div>
    
    <div *ngIf="error" class="error">
      {{ error }}
      <button mat-button (click)="loadLoans()">Retry</button>
    </div>
    
    <table mat-table [dataSource]="loans" class="mat-elevation-z8" *ngIf="!isLoading && !error">
      <ng-container matColumnDef="loanAmount">
        <th mat-header-cell *matHeaderCellDef>Loan Amount</th>
        <td mat-cell *matCellDef="let element">
          {{ element.loanAmount | currency }}
        </td>
      </ng-container>

      <ng-container matColumnDef="currentBalance">
        <th mat-header-cell *matHeaderCellDef>Current Balance</th>
        <td mat-cell *matCellDef="let element">
          {{ element.currentBalance | currency }}
        </td>
      </ng-container>

      <ng-container matColumnDef="applicant">
        <th mat-header-cell *matHeaderCellDef>Applicant</th>
        <td mat-cell *matCellDef="let element">{{ element.applicant }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let element">{{ element.status }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
    
    <div *ngIf="!isLoading && !error && loans.length === 0" class="no-data">
      No loans found.
    </div>
  </section>
</main>
