<div class="login-wrapper">
  <!-- Agregamos un fondo sutil animado para resaltar el glassmorphism -->
  <div class="ambient-glow ambient-glow-1"></div>
  <div class="ambient-glow ambient-glow-2"></div>

  <div class="login-card glass-panel-premium">
    <div class="login-header">
      <h1 class="topbar__title brand-text">LoanOS</h1>
      <p class="text-secondary subtitle">Sign in to access your dashboard</p>
    </div>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="login-form">
      <div class="form-group">
        <label for="username">Username</label>
        <div class="input-container">
          <input 
            type="text" 
            id="username" 
            name="username" 
            [(ngModel)]="username" 
            required 
            class="form-control"
            placeholder="e.g. admin"
          >
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-container">
          <input 
            [type]="showPassword ? 'text' : 'password'" 
            id="password" 
            name="password" 
            [(ngModel)]="password" 
            required 
            class="form-control password-field"
            placeholder="e.g. admin123"
          >
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <button type="button" class="icon-button" (click)="togglePasswordVisibility()" aria-label="Toggle password visibility">
            <svg *ngIf="!showPassword" class="input-icon interactive" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg *ngIf="showPassword" class="input-icon interactive" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
      </div>

      <div *ngIf="error" class="error-message">
        {{ error }}
      </div>

      <button
        type="submit"
        class="btn btn--primary btn--block"
        [disabled]="!loginForm.form.valid || isLoading"
      >
        <span *ngIf="!isLoading">Access Dashboard</span>
        <span *ngIf="isLoading" class="spinner-small" aria-hidden="true"></span>
      </button>

      <div class="hint text-secondary">
        <small>Demo Credentials: <strong>admin / admin123</strong></small>
      </div>
    </form>
  </div>
</div>
