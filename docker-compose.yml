version: '3.8'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: loan-management-db
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "LoanMgmt#2024!Secure"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'LoanMgmt#2024!Secure' -Q 'SELECT 1'"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
    networks:
      - loan-network

  api:
    build:
      context: ./backend/src
      dockerfile: Fundo.Applications.WebApi/Dockerfile
    container_name: loan-management-api
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_URLS=http://+:5000
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db,1433;Database=LoanManagementDb;User Id=sa;Password=LoanMgmt#2024!Secure;TrustServerCertificate=True;
      - Jwt__Key=YourSuperSecretKeyForJWTTokenGeneration123456789
      - Jwt__Issuer=LoanManagementAPI
      - Jwt__Audience=LoanManagementClient
    depends_on:
      - db
    networks:
      - loan-network

networks:
  loan-network:
    driver: bridge
