name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '6.0.x'
    
    - name: Restore dependencies
      run: dotnet restore backend/src/src.sln
    
    - name: Build
      run: dotnet build backend/src/src.sln --configuration Release --no-restore
    
    - name: Test
      run: dotnet test backend/src/src.sln --configuration Release --no-build --verbosity normal
